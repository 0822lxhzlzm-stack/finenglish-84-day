<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#143c34" />
    <meta name="description" content="面向金融数据分析职场人的84天英语训练应用" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>FinEnglish · 84天训练营</title>
    <link rel="stylesheet" href="./styles.css?v=7" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div>
          <p class="eyebrow">FINENGLISH</p>
          <h1>职场英语训练营</h1>
        </div>
        <button class="icon-button" id="settingsButton" aria-label="学习设置">⚙</button>
      </header>

      <main id="app" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="主要导航">
        <button class="nav-item active" data-view="today"><span>◉</span><b>今日</b></button>
        <button class="nav-item" data-view="plan"><span>▦</span><b>计划</b></button>
        <button class="nav-item" data-view="phrases"><span>◌</span><b>发音</b></button>
        <button class="nav-item" data-view="progress"><span>↗</span><b>进度</b></button>
      </nav>
    </div>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <div class="dialog-head">
          <div><p class="eyebrow">LEARNING SETUP</p><h2>学习设置</h2></div>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <label>开始日期<input type="date" id="startDateInput" /></label>
        <label>发音速度
          <select id="speechRateInput">
            <option value="0.7">慢速 0.7×</option>
            <option value="0.85">练习 0.85×</option>
            <option value="1">正常 1.0×</option>
          </select>
        </label>
        <button class="primary-button" id="saveSettings" value="default">保存设置</button>
        <button class="ghost-button" id="installButton" type="button">添加到手机主屏幕</button>
        <button class="danger-button" id="resetButton" type="button">清空所有学习记录</button>
      </form>
    </dialog>

    <script src="./plan-data.js?v=7"></script>
    <script src="./app.js?v=7"></script>
  </body>
</html>
